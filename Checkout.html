<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Paiement — StreamAlways</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="header">

    <div class="container header-content">

        <a href="index.html" class="brand">

            <div class="brand-logo">
                SA
            </div>

            <span>
                StreamAlways
            </span>

        </a>

        <a
            href="index.html"
            class="back-link">

            ← Retour

        </a>

    </div>

</header>


<main class="checkout-page">

<div class="container">

    <div class="checkout-header">

        <span>STREAMALWAYS</span>

        <h1>
            Finaliser votre commande
        </h1>

        <p>
            Effectuez votre paiement puis envoyez
            votre preuve de dépôt.
        </p>

    </div>


    <div class="checkout-grid">


        <section class="checkout-card">

            <h2>
                Votre commande
            </h2>

            <div id="checkoutItems">
                Chargement...
            </div>

            <div class="checkout-total">

                <span>Total</span>

                <strong id="checkoutTotal">
                    0 XAF
                </strong>

            </div>

        </section>


        <section class="checkout-card">

            <h2>
                Vos informations
            </h2>

            <label>
                Nom

                <input
                    id="customerName"
                    type="text"
                    placeholder="Votre nom">
            </label>


            <label>
                Numéro de téléphone

                <input
                    id="customerPhone"
                    type="tel"
                    placeholder="6XXXXXXXX">
            </label>


            <h2 class="payment-title">
                Moyen de paiement
            </h2>


            <div
                id="paymentMethods"
                class="payment-methods">

                Chargement...

            </div>


            <div
                id="paymentInstructions"
                class="payment-instructions">
            </div>


            <label>

                Référence de transaction

                <input
                    id="transactionReference"
                    type="text"
                    placeholder="Référence du dépôt">

            </label>


            <label>

                Capture du reçu

                <input
                    id="proofFile"
                    type="file"
                    accept="image/*">

            </label>


            <div
                id="filePreview"
                class="file-preview">
            </div>


            <button
                id="submitOrder"
                class="primary-btn full">

                Envoyer ma commande

            </button>


            <div
                id="checkoutMessage"
                class="checkout-message">
            </div>

        </section>

    </div>

</div>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
